# Profilo locale del gate di /commit (o3/commit_gate.py): formatter e controlli
# di method. Un adottante tiene il proprio con i suoi strumenti.

[[formatter]]
glob = "*.md"
comando = ["prettier", "--write"]

[[formatter]]
glob = "*.py"
comando = ["ruff", "format"]

[[controllo]]
comando = ["python3", "o3/view/build.py", "--check"]

[[controllo]]
quando = "kb/*"
comando = ["python3", "o3/kb_tools.py", "audit"]
fallisce_se = '^- [1-9]\d* (problemi strutturali|link rotti fuori dai nodi)'

# Uno strumento nuovo in o3/ va registrato in o3/prescriptions.md (o3/kb_domain.py).
[[controllo]]
quando = "o3/*"
comando = ["python3", "o3/kb_tools.py", "audit"]
fallisce_se = '^- [1-9]\d* (problemi strutturali|link rotti fuori dai nodi)'

[[controllo]]
quando = "*.py"
comando = ["python3", "-m", "unittest", "discover", "tests"]

[[controllo]]
quando = "*.md"
comando = ["python3", "o3/traduzioni.py", "check"]
